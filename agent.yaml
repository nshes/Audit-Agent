name: audit-agent
version: "1.0.0"
description: >
  버그 바운티 / 취약점 제보 파이프라인 감사 에이전트.
  앞선 모든 에이전트의 원칙 준수 여부를 결정론적 사전검사 + LLM 감사로 검증합니다.

# 오케스트레이터가 이 에이전트를 실행할 때 필요한 환경변수 목록
env:
  required:
    - UPSTAGE_API_KEY          # Upstage Solar LLM API 키
    - ORCHESTRATOR_BASE_URL    # 오케스트레이터 API 기본 주소 (예: https://api.mingyo.kim)
  optional:
    - ORCHESTRATOR_API_KEY     # 오케스트레이터 API 인증 토큰 (필요한 경우)

# 에이전트가 노출하는 HTTP 엔드포인트
endpoints:
  health: GET /health    # 상태 확인 (ready / working {job-id})
  invoke: POST /invoke   # 감사 실행 (report_id + trace_id + request_id)

port: 8000
